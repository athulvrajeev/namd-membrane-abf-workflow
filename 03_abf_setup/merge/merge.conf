#############################################################
## Layout adapted from the NAMD tutorial configuration files
## (Theoretical and Computational Biophysics Group, University of
## Illinois Urbana-Champaign); modified by Athul V. Rajeev for
## ABF windows. See README.md (Acknowledgements).
#############################################################

#############################################################
## JOB DESCRIPTION                                         ##
#############################################################

# ABF of gold_cancer_lipid_40A_wpl70, merge	

#############################################################
## ADJUSTABLE PARAMETERS                                   ##
#############################################################

structure          smd_gold_cancer_lipid_40A.psf
coordinates        smd_gold_cancer_lipid_40A.pdb

exec mkdir -p merge_output

set temperature    310
set outputname     output/win0

#extendedSystem     npt.restart.xsc
if {1} {
set inputname      merge
binCoordinates     $inputname.restart.coor
binVelocities      $inputname.restart.vel  ;# remove the "temperature" entry if you use this!
extendedSystem     $inputname.restart.xsc
}
firsttimestep 0

#############################################################
## SIMULATION PARAMETERS                                   ##
#############################################################

# Input
paraTypeCharmm	    on

parameters /path/to/toppar/toppar_all36_carb_glycolipid.str
parameters /path/to/toppar/toppar_all36_lipid_sphingo.str
parameters /path/to/toppar/toppar_all36_lipid_detergent.str
parameters /path/to/toppar/toppar_all36_lipid_prot.str
parameters /path/to/toppar/toppar_all36_dphpc.str  
parameters /path/to/toppar/par_all36_prot.prm
parameters /path/to/toppar/par_all36_na.prm
parameters /path/to/toppar/par_all36_lipid.prm
parameters /path/to/toppar/par_all36_carb.prm
parameters /path/to/toppar/par_all36_cgenff.prm   
parameters /path/to/toppar/toppar_water_ions_cufix.str
parameters /path/to/toppar/par_interface.prm                ##it is parameter file for AG, rest is for lipid
parameters /path/to/toppar/toppar_all36_lipid_cholesterol.str    ##when added cholestrol


##temperature         $temperature


# Force-Field Parameters
rigidBonds          all ;# freezes bond length between hydrogen and other atoms
                        ;#   which is the fastest vibrational mode in an MD sim
                        ;# holding this rigid allows 2fs timestep
## short-range interactions
exclude             scaled1-4
1-4scaling          1.0
switching           on
switchdist           8
cutoff              10
pairlistdist        12
margin              10


# Integrator Parameters
timestep            2.0  ;# 2fs/step (only if needed to finish quickly)
nonbondedFreq       1
fullElectFrequency  3  
stepspercycle       12


# Constant Temperature Control
langevin            on    ;# do langevin dynamicsgmail.google.com
langevinDamping     1     ;# damping coefficient (gamma) of 5/ps
langevinTemp        $temperature
langevinHydrogen    off    ;# don't couple langevin bath to hydrogens


# Periodic Boundary Conditions
 if {0} {
cellBasisVector1    66    0.   0.
cellBasisVector2     0.   76   0.
cellBasisVector3     0.    0   77
cellOrigin           0.15782606601715088  -0.177275151014328  -0.12943784892559052
}
wrapAll             on


# PME (for full-system periodic electrostatics)
PME                 yes
PMEGridSpacing      1.0

if {1} {
langevinPiston        on      ;# turn this off for constant volume sim
langevinPistonTarget  1.01325 ;#  in bar -> 1 atm
langevinPistonPeriod  200.
langevinPistonDecay   100.
langevinPistonTemp    $temperature
}
## additional 
useGroupPressure      yes ;# yes = don't needed for rigidBonds (see rigidBonds below)
useFlexibleCell      yes ;# allow x,y,z dimensions to fluctuate independently?
#useConstantArea     yes  ;#   if so, fix area of xy-plane?
useConstantRatio      yes  ;#   OR if so, fix aspect ratio of xy-plane?


# Constant Pressure Control (variable volume)



# Output
outputName          $outputname

restartfreq         9600     ;# 1000steps = every 1ps
dcdfreq             9600
xstFreq             9600
outputEnergies      9600
outputPressure      9600


#############################################################
## EXTRA PARAMETERS                                        ##
#############################################################

colvars              on
colvarsConfig        ${inputname}.in

#############################################################
## EXECUTION SCRIPT                                        ##
#############################################################

# Minimization
#minimize 2400000

# Equilibration Dynamics
#for {set i 0} {$i < 4} {incr i} {
#    run 600000
#    reinitvels $temperature
#}


# Minimization
minimize    48000
run 0 ;#  

